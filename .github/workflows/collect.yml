name: Collect snapshots

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: collect

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out data branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git ls-remote --exit-code --heads origin data >/dev/null; then
            tree=$(git hash-object -t tree /dev/null)
            commit=$(git commit-tree "$tree" -m 'Initialize data branch')
            git push origin "$commit:refs/heads/data"
          fi
          git fetch origin data
          git worktree add _data origin/data

      - name: Poll YouTube
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/collect.mjs

      - name: Publish snapshots
        run: |
          cd _data
          git add snapshots.json
          git diff --cached --quiet && exit 0
          git commit -m "Snapshots $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push origin HEAD:data
